[package]
name = "yadgar-dial"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "Apache-2.0"
description = "How a service reaches another service: client-side gRPC balancing over a headless Service (D23)."

[dependencies]
# Only what dialling needs. No proto, no telemetry, no store — a crate every
# service links should pull in as little as possible, because its dependency tree
# becomes theirs.
#
# `metrics` IS THE ONE EXCEPTION, AND IT IS AN EXCEPTION RATHER THAN A DRIFT.
# The rule above is about weight, so the weight was MEASURED with
# `cargo tree -e normal` rather than assumed: 66 crates before, 69 after — this
# facade, `rapidhash`, and `rustversion` as a proc-macro. Nothing else moves.
#
# What it buys is the signal v0.2.0 removed. Making the boot dial lazy was
# right, and it traded away the only thing that ever said an upstream was
# missing: a service whose upstream is absent used to crash-loop, which showed
# up as CrashLoopBackOff, a climbing restart count, a Deployment at 0/2 and a
# Degraded Argo application. It now reports `1/1 Running` with zero restarts,
# and NOTHING in Kubernetes says anything is wrong. The ERROR line `still_absent`
# emits was offered as the replacement and is not one: the `observability`
# namespace runs a Prometheus server and NO log shipper — verified 2026-09-04,
# `deploy/infra/` contains no promtail, loki, fluent-bit or vector — so that line
# reaches `kubectl logs` and nowhere else, which is to say it reaches an operator
# who already suspects the problem.
#
# THE FACADE ONLY, for the reason `yadgar-telemetry` and `yadgar-lifecycle` both
# state: a library that installs an exporter decides the backend for every
# service that links it. The binary installs one.
#
# NOT BEHIND A FEATURE, deliberately, and there are two arguments. A signal that
# can be compiled out has a default state of absent, which is the condition
# being fixed. And this crate declares no features today, so the shared CI skips
# `cargo test --no-default-features` entirely — its predicate reads
# `cargo metadata` — and adding one would newly activate that step. That is cost
# spent to buy the ability to remove a signal.
metrics = "0.24"
tonic = { version = "0.14", default-features = false, features = [
  "codegen",
  "transport",
  "channel",
  # `tls-ring`, NOT `tls-aws-lc`. aws-lc-rs needs cmake and a C toolchain, and
  # every service that links this crate builds for x86_64-unknown-linux-musl
  # (D63). ring builds for musl with the toolchain already in the base image.
  #
  # NEITHER `tls-native-roots` NOR `tls-webpki-roots` is enabled, deliberately.
  # Those add the platform trust store, and a private CA that fails to load
  # would then silently fall back to it — the same class of silent downgrade
  # this whole change exists to remove, one layer up.
  "tls-ring",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
tracing = "0.1"
thiserror = "2"
# The SAME PEM parser tonic itself uses on the bundle, so "we found N
# certificates" is exactly what tonic will find. Present in the tree already, by
# way of tokio-rustls; naming it directly costs nothing and buys the non-empty
# assertion in `TlsOptions::prepare`.
rustls-pki-types = { version = "1", features = ["std"] }
# For `RootCertStore::add_parsable_certificates` ALONE, so the CA bundle can be
# asserted non-empty the way tonic will actually build it. tonic feeds the PEM
# through `CertificateDer::pem_reader_iter` into `add_parsable_certificates` and
# DISCARDS the return (`tonic-0.14.6/src/transport/channel/service/tls.rs:104`),
# so a bundle whose sections all fail to parse as a trust anchor yields the empty
# root store with no error. Counting PEM sections cannot see that.
#
# `default-features = false` with `std` alone: NO crypto provider is pulled in
# here. tonic already chooses `ring` through `tls-ring`, and a second provider in
# the tree is how a build acquires an ambiguous default.
rustls = { version = "0.23", default-features = false, features = ["std"] }

[dev-dependencies]
# `test-util` is a TEST-ONLY feature: the `refresh` loop sleeps `RERESOLVE`
# between ticks, so a test of it either takes five seconds per tick or runs on a
# paused clock. `start_paused = true` makes every case here deterministic and
# sub-millisecond. A dev-dependency's features do not reach anything that links
# this crate, so the shipped dependency tree is unchanged.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }
# `router` is a TEST-ONLY feature: the TLS tests need a real gRPC server to
# handshake against, and `Server::serve` needs a `Routes`. A dev-dependency's
# features do not reach anything that links this crate, so the shipped
# dependency tree is unchanged.
tonic = { version = "0.14", default-features = false, features = ["router"] }
# Certificates are MINTED PER TEST RUN rather than checked in: a fixture key in
# the repository is a secret in the repository, and it expires.
rcgen = { version = "0.14", default-features = false, features = ["pem", "ring"] }
tokio-stream = { version = "0.1", features = ["net"] }
# `DebuggingRecorder` + `with_local_recorder`: the only way to assert that the
# metric NAME a dashboard queries, the LABEL an alert groups by, and the value
# the gauge receives are what this crate claims.
#
# MUST resolve against `metrics 0.24`, and this is not a version-hygiene note —
# a `metrics-util` built on another major links a SECOND facade, and then the
# snapshot comes back EMPTY while every assertion still compiles and passes.
# Which is why every case below asserts the snapshot's LENGTH before reading it.
metrics-util = { version = "0.20", features = ["debugging"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
